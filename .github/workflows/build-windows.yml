name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch native source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build\source.b64.part*" | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 source bundle parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw -Encoding utf8 }) -join ""
          $b64 = $b64 -replace "\s", ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "source.zip" -DestinationPath "." -Force
          if (!(Test-Path "src\ScanPrintStudio\ScanPrintStudio.csproj")) { throw "Source reconstruction failed." }

          # Epson/WIA compatibility fixes.
          # Epson document-scanner WIA drivers are stricter than many HP drivers:
          # - Pages=0 (ALL_PAGES) can make Automation Transfer return E_INVALIDARG.
          # - WIA 2 feeder items use FRONT_ONLY/DUPLEX, not the obsolete FEEDER flag.
          # - Setting standard page size and explicit extents together can create an invalid property combination.
          $scannerPath = "src\ScanPrintStudio\Services\ScannerService.cs"
          $scanner = Get-Content $scannerPath -Raw -Encoding utf8

          $scanner = $scanner.Replace(
            "private const int SelectFrontFirst = 0x008;",
            "private const int SelectFrontFirst = 0x008;" + [Environment]::NewLine + "    private const int SelectFrontOnly = 0x020;"
          )

          $scanner = $scanner.Replace("Convert.ToString(item.Name)", "Convert.ToString(item.ItemID)")

          $scanner = $scanner.Replace(
            "TrySetProperty(scanItem.Properties, WiaIpsDocumentHandlingSelect, sourceSelect);",
            "TrySetProperty(scanItem.Properties, WiaIpsDocumentHandlingSelect, options.Source == ScanSource.Adf ? (options.Sides == ScanSides.TwoSided ? SelectDuplex | SelectFrontFirst : SelectFrontOnly) : sourceSelect);"
          )

          $scanner = $scanner.Replace(
            "TrySetProperty(scanItem.Properties, WiaIpsPages, 0);",
            "TrySetProperty(scanItem.Properties, WiaIpsPages, 1);"
          )
          $scanner = $scanner.Replace(
            "TrySetProperty(device.Properties, WiaIpsPages, 0);",
            "TrySetProperty(device.Properties, WiaIpsPages, 1);"
          )

          $oldPageBlock = @'
            if (options.PaperSize.WiaPageCode is int code) TrySetProperty(item.Properties, WiaIpsPageSize, code);
            if (!options.PaperSize.IsAuto)
            {
                var (w, h) = options.PaperSize.Pixels(options.Dpi);
                TrySetProperty(item.Properties, WiaIpsXPos, 0);
                TrySetProperty(item.Properties, WiaIpsYPos, 0);
                TrySetProperty(item.Properties, WiaIpsXExtent, w);
                TrySetProperty(item.Properties, WiaIpsYExtent, h);
            }
'@
          $newPageBlock = @'
            bool pageSizeSet = false;
            if (options.PaperSize.WiaPageCode is int code) pageSizeSet = TrySetProperty(item.Properties, WiaIpsPageSize, code);
            if (!options.PaperSize.IsAuto && !pageSizeSet)
            {
                var (w, h) = options.PaperSize.Pixels(options.Dpi);
                TrySetProperty(item.Properties, WiaIpsXPos, 0);
                TrySetProperty(item.Properties, WiaIpsYPos, 0);
                TrySetProperty(item.Properties, WiaIpsXExtent, w);
                TrySetProperty(item.Properties, WiaIpsYExtent, h);
            }
'@
          $scanner = $scanner.Replace($oldPageBlock, $newPageBlock)

          if ($scanner -match "item\.Name") { throw "WIA item.Name hotfix was not fully applied." }
          if ($scanner -match "WiaIpsPages, 0") { throw "ADF Pages=1 compatibility hotfix was not fully applied." }
          if ($scanner -notmatch "SelectFrontOnly") { throw "WIA 2 FRONT_ONLY hotfix missing." }
          Set-Content -Path $scannerPath -Value $scanner -Encoding utf8NoBOM

          # Build version 1.0.2.
          $projectPath = "src\ScanPrintStudio\ScanPrintStudio.csproj"
          $project = Get-Content $projectPath -Raw -Encoding utf8
          $project = $project.Replace("<Version>1.0.0</Version>", "<Version>1.0.2</Version>")
          $project = $project.Replace("<FileVersion>1.0.0.0</FileVersion>", "<FileVersion>1.0.2.0</FileVersion>")
          $project = $project.Replace("<AssemblyVersion>1.0.0.0</AssemblyVersion>", "<AssemblyVersion>1.0.2.0</AssemblyVersion>")
          Set-Content -Path $projectPath -Value $project -Encoding utf8NoBOM

          $xamlPath = "src\ScanPrintStudio\MainWindow.xaml"
          $xaml = Get-Content $xamlPath -Raw -Encoding utf8
          $xaml = $xaml.Replace("v1.0.0 Native", "v1.0.2 Native")
          Set-Content -Path $xamlPath -Value $xaml -Encoding utf8NoBOM

          $issPath = "Installer\ScanPrintStudio.iss"
          $iss = Get-Content $issPath -Raw -Encoding utf8
          $iss = $iss.Replace('#define MyAppVersion "1.0.0"', '#define MyAppVersion "1.0.2"')
          $iss = $iss.Replace("VersionInfoVersion=1.0.0.0", "VersionInfoVersion=1.0.2.0")
          Set-Content -Path $issPath -Value $iss -Encoding utf8NoBOM

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/ScanPrintStudio/ScanPrintStudio.csproj

      - name: Publish Windows application
        run: >
          dotnet publish src/ScanPrintStudio/ScanPrintStudio.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "Installer\ScanPrintStudio.iss"'

      - name: Verify outputs
        shell: pwsh
        run: |
          if (!(Test-Path "artifacts\publish\ScanPrintStudio.exe")) { throw "Application executable missing." }
          if (!(Test-Path "artifacts\installer\ScanPrintStudio-Setup-x64.exe")) { throw "Installer executable missing." }
          Get-Item artifacts\publish\ScanPrintStudio.exe
          Get-Item artifacts\installer\ScanPrintStudio-Setup-x64.exe
          Get-FileHash artifacts\publish\ScanPrintStudio.exe -Algorithm SHA256
          Get-FileHash artifacts\installer\ScanPrintStudio-Setup-x64.exe -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ScanPrintStudio-Windows11-Installer
          path: |
            artifacts/installer/ScanPrintStudio-Setup-x64.exe
            artifacts/publish/ScanPrintStudio.exe
          if-no-files-found: error
          compression-level: 0
