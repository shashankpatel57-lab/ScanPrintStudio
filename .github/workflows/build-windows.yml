name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct native source
        shell: powershell
        run: |
          $parts = Get-ChildItem "build\source.b64.part*" | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 source bundle parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $b64 = $b64 -replace "\s", ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "source.zip" -DestinationPath "." -Force
          if (!(Test-Path "src\ScanPrintStudio\ScanPrintStudio.csproj")) { throw "Source reconstruction failed." }

          # The original source bundle relies on explicit System.IO in several files.
          # Read as UTF-8 so Unicode UI/status text is not corrupted.
          Get-ChildItem "src\ScanPrintStudio" -Filter *.cs -Recurse | ForEach-Object {
            $text = Get-Content $_.FullName -Raw -Encoding UTF8
            if ($text -notmatch "using System.IO;") {
              Set-Content -Path $_.FullName -Value ("using System.IO;" + [Environment]::NewLine + $text) -Encoding UTF8
            }
          }

          $scannerPath = "src\ScanPrintStudio\Services\ScannerService.cs"
          $scanner = Get-Content $scannerPath -Raw -Encoding UTF8

          # WIA COM item hotfix.
          $scanner = $scanner.Replace("Convert.ToString(item.Name)", "Convert.ToString(item.ItemID)")

          # WIA 2 feeder-item mode. FRONT_ONLY is the correct single-sided feeder flag.
          $scanner = $scanner.Replace(
            "private const int SelectFrontFirst = 0x008;",
            "private const int SelectFrontFirst = 0x008;" + [Environment]::NewLine + "    private const int SelectFrontOnly = 0x020;"
          )
          $scanner = $scanner.Replace(
            "TrySetProperty(scanItem.Properties, WiaIpsDocumentHandlingSelect, sourceSelect);",
            "TrySetProperty(scanItem.Properties, WiaIpsDocumentHandlingSelect, options.Source == ScanSource.Adf ? (options.Sides == ScanSides.TwoSided ? SelectDuplex | SelectFrontFirst : SelectFrontOnly) : sourceSelect);"
          )

          # Epson document-scanner WIA drivers can reject ALL_PAGES=0 when the Automation
          # Transfer API is used page-by-page. Request one image per transfer instead.
          $scanner = $scanner.Replace("TrySetProperty(scanItem.Properties, WiaIpsPages, 0);", "TrySetProperty(scanItem.Properties, WiaIpsPages, options.Sides == ScanSides.TwoSided ? 2 : 1);")
          $scanner = $scanner.Replace("TrySetProperty(device.Properties, WiaIpsPages, 0);", "TrySetProperty(device.Properties, WiaIpsPages, options.Sides == ScanSides.TwoSided ? 2 : 1);")

          if ($scanner -match "item\.Name") { throw "WIA item.Name hotfix was not fully applied." }
          if ($scanner -match "WiaIpsPages, 0") { throw "ADF pages hotfix was not fully applied." }
          if ($scanner -notmatch "SelectFrontOnly") { throw "WIA FRONT_ONLY hotfix missing." }
          Set-Content -Path $scannerPath -Value $scanner -Encoding UTF8

          # v1.0.4: Epson DS-series duplex is routed through Epson's TWAIN/Epson Scan 2 source.
          # WIA Automation works for single-sided acquisition on these scanners, but some Epson
          # WIA drivers reject duplex acquisition with E_INVALIDARG. NAPS2 provides a robust
          # TWAIN bridge plus a 32-bit worker so our 64-bit app can use Epson's common 32-bit DS.
          $modelsPath = "src\ScanPrintStudio\Models\Models.cs"
          $models = Get-Content $modelsPath -Raw -Encoding UTF8
          $models = $models.Replace(
            'public string ScannerId { get; set; } = "";',
            'public string ScannerId { get; set; } = "";' + [Environment]::NewLine +
            '    public string ScannerName { get; set; } = "";' + [Environment]::NewLine +
            '    public string ScannerManufacturer { get; set; } = "";'
          )
          Set-Content -Path $modelsPath -Value $models -Encoding UTF8

          $mainPath = "src\ScanPrintStudio\MainWindow.xaml.cs"
          $main = Get-Content $mainPath -Raw -Encoding UTF8
          $main = $main.Replace(
            'ScannerId = scanner.Id,',
            'ScannerId = scanner.Id,' + [Environment]::NewLine +
            '            ScannerName = scanner.Name,' + [Environment]::NewLine +
            '            ScannerManufacturer = scanner.Manufacturer,'
          )
          Set-Content -Path $mainPath -Value $main -Encoding UTF8

          $scanner = Get-Content $scannerPath -Raw -Encoding UTF8
          $scanPattern = 'public Task<List<string>> ScanAsync\(ScanOptions options, IProgress<string>\? progress = null\) => RunStaAsync\(\(\) =>\s*\{'
          $newScanSignature = @(
            'public async Task<List<string>> ScanAsync(ScanOptions options, IProgress<string>? progress = null)',
            '    {',
            '        bool isEpson = options.ScannerManufacturer.Contains("EPSON", StringComparison.OrdinalIgnoreCase)',
            '                       || options.ScannerName.Contains("EPSON", StringComparison.OrdinalIgnoreCase);',
            '        if (isEpson && options.Source == ScanSource.Adf && options.Sides == ScanSides.TwoSided)',
            '        {',
            '            return await EpsonTwainService.ScanAsync(options, progress);',
            '        }',
            '        return await ScanWiaAsync(options, progress);',
            '    }',
            '',
            '    private Task<List<string>> ScanWiaAsync(ScanOptions options, IProgress<string>? progress = null) => RunStaAsync(() =>',
            '    {'
          ) -join [Environment]::NewLine
          if ($scanner -notmatch $scanPattern) { throw "Could not patch ScannerService ScanAsync routing." }
          $scanner = [regex]::Replace($scanner, $scanPattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $newScanSignature }, 1)
          Set-Content -Path $scannerPath -Value $scanner -Encoding UTF8

          $epsonServiceB64 = ''
          [IO.File]::WriteAllBytes(
            "src\ScanPrintStudio\Services\EpsonTwainService.cs",
            [Convert]::FromBase64String($epsonServiceB64)
          )

          $projectPath = "src\ScanPrintStudio\ScanPrintStudio.csproj"
          $project = Get-Content $projectPath -Raw -Encoding UTF8
          if ($project -notmatch 'NAPS2.Sdk') {
            $packages = @(
              '  <ItemGroup>',
              '    <PackageReference Include="NAPS2.Sdk" Version="1.4.0" />',
              '    <PackageReference Include="NAPS2.Images.Gdi" Version="1.4.0" />',
              '    <PackageReference Include="NAPS2.Sdk.Worker.Win32" Version="1.4.0" />',
              '  </ItemGroup>'
            ) -join [Environment]::NewLine
            $project = $project.Replace("</Project>", $packages + [Environment]::NewLine + "</Project>")
          }
          Set-Content -Path $projectPath -Value $project -Encoding UTF8

          # Version corrected native build.
          $projectPath = "src\ScanPrintStudio\ScanPrintStudio.csproj"
          $project = Get-Content $projectPath -Raw -Encoding UTF8
          $project = $project.Replace("<Version>1.0.0</Version>", "<Version>1.0.4</Version>")
          $project = $project.Replace("<FileVersion>1.0.0.0</FileVersion>", "<FileVersion>1.0.4.0</FileVersion>")
          $project = $project.Replace("<AssemblyVersion>1.0.0.0</AssemblyVersion>", "<AssemblyVersion>1.0.4.0</AssemblyVersion>")
          Set-Content -Path $projectPath -Value $project -Encoding UTF8

          $xamlPath = "src\ScanPrintStudio\MainWindow.xaml"
          $xaml = Get-Content $xamlPath -Raw -Encoding UTF8
          $xaml = $xaml.Replace("v1.0.0 Native", "v1.0.4 Native")
          Set-Content -Path $xamlPath -Value $xaml -Encoding UTF8

          $issPath = "Installer\ScanPrintStudio.iss"
          $iss = Get-Content $issPath -Raw -Encoding UTF8
          $iss = $iss.Replace('#define MyAppVersion "1.0.0"', '#define MyAppVersion "1.0.4"')
          $iss = $iss.Replace("VersionInfoVersion=1.0.0.0", "VersionInfoVersion=1.0.4.0")
          Set-Content -Path $issPath -Value $iss -Encoding UTF8

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/ScanPrintStudio/ScanPrintStudio.csproj

      - name: Publish Windows application
        run: >
          dotnet publish src/ScanPrintStudio/ScanPrintStudio.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "Installer\ScanPrintStudio.iss"'

      - name: Verify outputs
        shell: powershell
        run: |
          if (!(Test-Path "artifacts\publish\ScanPrintStudio.exe")) { throw "Application executable missing." }
          if (!(Test-Path "artifacts\installer\ScanPrintStudio-Setup-x64.exe")) { throw "Installer executable missing." }
          Get-Item artifacts\publish\ScanPrintStudio.exe
          Get-Item artifacts\installer\ScanPrintStudio-Setup-x64.exe
          Get-FileHash artifacts\publish\ScanPrintStudio.exe -Algorithm SHA256
          Get-FileHash artifacts\installer\ScanPrintStudio-Setup-x64.exe -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ScanPrintStudio-Windows11-Installer
          path: |
            artifacts/installer/ScanPrintStudio-Setup-x64.exe
            artifacts/publish/ScanPrintStudio.exe
          if-no-files-found: error
          compression-level: 0
