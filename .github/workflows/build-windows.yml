name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct native source
        shell: powershell
        run: |
          $parts = Get-ChildItem "build\source.b64.part*" | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 source bundle parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $b64 = $b64 -replace "\s", ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "source.zip" -DestinationPath "." -Force
          if (!(Test-Path "src\ScanPrintStudio\ScanPrintStudio.csproj")) { throw "Source reconstruction failed." }

          # The original source bundle relies on explicit System.IO in several files.
          # Read as UTF-8 so Unicode UI/status text is not corrupted.
          Get-ChildItem "src\ScanPrintStudio" -Filter *.cs -Recurse | ForEach-Object {
            $text = Get-Content $_.FullName -Raw -Encoding UTF8
            if ($text -notmatch "using System.IO;") {
              Set-Content -Path $_.FullName -Value ("using System.IO;" + [Environment]::NewLine + $text) -Encoding UTF8
            }
          }

          $scannerPath = "src\ScanPrintStudio\Services\ScannerService.cs"
          $scanner = Get-Content $scannerPath -Raw -Encoding UTF8

          # WIA COM item hotfix.
          $scanner = $scanner.Replace("Convert.ToString(item.Name)", "Convert.ToString(item.ItemID)")

          # WIA 2 feeder-item mode. FRONT_ONLY is the correct single-sided feeder flag.
          $scanner = $scanner.Replace(
            "private const int SelectFrontFirst = 0x008;",
            "private const int SelectFrontFirst = 0x008;" + [Environment]::NewLine + "    private const int SelectFrontOnly = 0x020;"
          )
          $scanner = $scanner.Replace(
            "TrySetProperty(scanItem.Properties, WiaIpsDocumentHandlingSelect, sourceSelect);",
            "TrySetProperty(scanItem.Properties, WiaIpsDocumentHandlingSelect, options.Source == ScanSource.Adf ? (options.Sides == ScanSides.TwoSided ? SelectDuplex | SelectFrontFirst : SelectFrontOnly) : sourceSelect);"
          )

          # Epson document-scanner WIA drivers can reject ALL_PAGES=0 when the Automation
          # Transfer API is used page-by-page. Request one image per transfer instead.
          $scanner = $scanner.Replace("TrySetProperty(scanItem.Properties, WiaIpsPages, 0);", "TrySetProperty(scanItem.Properties, WiaIpsPages, options.Sides == ScanSides.TwoSided ? 2 : 1);")
          $scanner = $scanner.Replace("TrySetProperty(device.Properties, WiaIpsPages, 0);", "TrySetProperty(device.Properties, WiaIpsPages, options.Sides == ScanSides.TwoSided ? 2 : 1);")

          if ($scanner -match "item\.Name") { throw "WIA item.Name hotfix was not fully applied." }
          if ($scanner -match "WiaIpsPages, 0") { throw "ADF pages hotfix was not fully applied." }
          if ($scanner -notmatch "SelectFrontOnly") { throw "WIA FRONT_ONLY hotfix missing." }
          Set-Content -Path $scannerPath -Value $scanner -Encoding UTF8

          # v1.0.7: Epson DS-series duplex is routed through Epson's TWAIN/Epson Scan 2 source.
          # WIA Automation works for single-sided acquisition on these scanners, but some Epson
          # WIA drivers reject duplex acquisition with E_INVALIDARG. NAPS2 provides a robust
          # TWAIN bridge plus a 32-bit worker so our 64-bit app can use Epson's common 32-bit DS.
          $modelsPath = "src\ScanPrintStudio\Models\Models.cs"
          $models = Get-Content $modelsPath -Raw -Encoding UTF8
          $models = $models.Replace(
            'public string ScannerId { get; set; } = "";',
            'public string ScannerId { get; set; } = "";' + [Environment]::NewLine +
            '    public string ScannerName { get; set; } = "";' + [Environment]::NewLine +
            '    public string ScannerManufacturer { get; set; } = "";'
          )
          Set-Content -Path $modelsPath -Value $models -Encoding UTF8

          $mainPath = "src\ScanPrintStudio\MainWindow.xaml.cs"
          $main = Get-Content $mainPath -Raw -Encoding UTF8
          $main = $main.Replace(
            'ScannerId = scanner.Id,',
            'ScannerId = scanner.Id,' + [Environment]::NewLine +
            '            ScannerName = scanner.Name,' + [Environment]::NewLine +
            '            ScannerManufacturer = scanner.Manufacturer,'
          )
          Set-Content -Path $mainPath -Value $main -Encoding UTF8

          $scanner = Get-Content $scannerPath -Raw -Encoding UTF8
          $scanPattern = 'public Task<List<string>> ScanAsync\(ScanOptions options, IProgress<string>\? progress = null\) => RunStaAsync\(\(\) =>\s*\{'
          $newScanSignature = @(
            'public async Task<List<string>> ScanAsync(ScanOptions options, IProgress<string>? progress = null)',
            '    {',
            '        bool isEpson = options.ScannerManufacturer.Contains("EPSON", StringComparison.OrdinalIgnoreCase)',
            '                       || options.ScannerName.Contains("EPSON", StringComparison.OrdinalIgnoreCase);',
            '        if (isEpson && options.Source == ScanSource.Adf)',
            '        {',
            '            return await EpsonTwainService.ScanAsync(options, progress);',
            '        }',
            '        return await ScanWiaAsync(options, progress);',
            '    }',
            '',
            '    private Task<List<string>> ScanWiaAsync(ScanOptions options, IProgress<string>? progress = null) => RunStaAsync(() =>',
            '    {'
          ) -join [Environment]::NewLine
          if ($scanner -notmatch $scanPattern) { throw "Could not patch ScannerService ScanAsync routing." }
          $scanner = [regex]::Replace($scanner, $scanPattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $newScanSignature }, 1)
          Set-Content -Path $scannerPath -Value $scanner -Encoding UTF8

          $epsonServiceB64 = ''
          [IO.File]::WriteAllBytes(
            "src\ScanPrintStudio\Services\EpsonTwainService.cs",
            [Convert]::FromBase64String($epsonServiceB64)
          )
          $epsonPath = "src\ScanPrintStudio\Services\EpsonTwainService.cs"
          $epsonText = Get-Content $epsonPath -Raw -Encoding UTF8
          $epsonText = $epsonText.Replace(
            'PaperSource = PaperSource.Duplex,',
            'PaperSource = options.Sides == ScanSides.TwoSided ? PaperSource.Duplex : PaperSource.Feeder,'
          )
          $epsonText = $epsonText.Replace(
            'MaxQuality = true,',
            'MaxQuality = false,' + [Environment]::NewLine + '            Quality = 92,'
          )
          $epsonText = $epsonText.Replace(
            '$"twain-raw-{++page:000}.png"',
            '$"twain-raw-{++page:000}.bmp"'
          )
          $epsonText = $epsonText.Replace(
            'progress?.Report("Scanning both sides from Epson ADF...");',
            'progress?.Report(options.Sides == ScanSides.TwoSided ? "Scanning both sides continuously from Epson ADF..." : "Scanning pages continuously from Epson ADF...");'
          )
          if ($epsonText -notmatch "using System.IO;") {
            Set-Content -Path $epsonPath -Value ("using System.IO;" + [Environment]::NewLine + $epsonText) -Encoding UTF8
          }

          $projectPath = "src\ScanPrintStudio\ScanPrintStudio.csproj"
          $project = Get-Content $projectPath -Raw -Encoding UTF8
          if ($project -notmatch 'NAPS2.Sdk') {
            $packages = @(
              '  <ItemGroup>',
              '    <PackageReference Include="NAPS2.Sdk" Version="1.4.0" />',
              '    <PackageReference Include="NAPS2.Images.Gdi" Version="1.4.0" />',
              '    <PackageReference Include="NAPS2.Sdk.Worker.Win32" Version="1.4.0" />',
              '  </ItemGroup>'
            ) -join [Environment]::NewLine
            $project = $project.Replace("</Project>", $packages + [Environment]::NewLine + "</Project>")
          }
          Set-Content -Path $projectPath -Value $project -Encoding UTF8


          # v1.0.7: persistent image defaults, one-scan manual naming, and safer blank-page detection.
          $models = Get-Content $modelsPath -Raw -Encoding UTF8
          $models = $models.Replace(
            '    public string? DefaultPrinterName { get; set; }',
            '    public string? DefaultPrinterName { get; set; }' + [Environment]::NewLine +
            '    public int DefaultBrightness { get; set; }' + [Environment]::NewLine +
            '    public int DefaultContrast { get; set; }' + [Environment]::NewLine +
            '    public double DefaultGamma { get; set; } = 1.0;' + [Environment]::NewLine +
            '    public string DefaultTextEnhancement { get; set; } = "Off";' + [Environment]::NewLine +
            '    public bool DefaultSkipBlankPages { get; set; } = true;' + [Environment]::NewLine +
            '    public string DefaultBlankDetection { get; set; } = "Conservative";'
          )
          Set-Content -Path $modelsPath -Value $models -Encoding UTF8

          $xamlPath = "src\ScanPrintStudio\MainWindow.xaml"
          $xaml = Get-Content $xamlPath -Raw -Encoding UTF8
          $copyBlankLine = '                                                <CheckBox x:Name="CopySkipBlank" Content="Skip blank pages" IsChecked="True"/>'
          $xaml = $xaml.Replace(
            $copyBlankLine,
            $copyBlankLine + [Environment]::NewLine +
            '                                                <TextBlock Text="Blank page detection" Margin="0,8,0,0"/>' + [Environment]::NewLine +
            '                                                <ComboBox x:Name="CopyBlankModeCombo" Margin="0,4,0,8"/>' + [Environment]::NewLine +
            '                                                <Button Content="SAVE IMAGE SETTINGS AS DEFAULT" Tag="Copy" Click="SaveImageSettings_Click" HorizontalAlignment="Left" Padding="10,6"/>'
          )
          $scanBlankLine = '                                                <CheckBox x:Name="ScanSkipBlank" Content="Skip blank pages" IsChecked="True"/>'
          $xaml = $xaml.Replace(
            $scanBlankLine,
            $scanBlankLine + [Environment]::NewLine +
            '                                                <TextBlock Text="Blank page detection" Margin="0,8,0,0"/>' + [Environment]::NewLine +
            '                                                <ComboBox x:Name="ScanBlankModeCombo" Margin="0,4,0,8"/>' + [Environment]::NewLine +
            '                                                <Button Content="SAVE IMAGE SETTINGS AS DEFAULT" Tag="Scan" Click="SaveImageSettings_Click" HorizontalAlignment="Left" Padding="10,6"/>'
          )
          $xaml = $xaml.Replace(
            '                                                <ComboBox x:Name="ScanNameOptionCombo" Visibility="Collapsed" Margin="0,4,0,10"/>',
            '                                                <ComboBox x:Name="ScanNameOptionCombo" SelectionChanged="ScanNameOptionCombo_SelectionChanged" Visibility="Collapsed" Margin="0,4,0,10"/>'
          )
          $manualLine = '                                                <TextBox x:Name="ScanManualNameText" Margin="0,4,0,10"/>'
          $xaml = $xaml.Replace(
            $manualLine,
            '                                                <TextBox x:Name="ScanManualNameText" TextChanged="ScanManualNameText_TextChanged" Margin="0,4,0,10"/>' + [Environment]::NewLine +
            '                                                <TextBlock Text="Manual file name override (optional - this scan only)"/>' + [Environment]::NewLine +
            '                                                <TextBox x:Name="ScanOverrideNameText" TextChanged="ScanOverrideNameText_TextChanged" ToolTip="Leave blank to use the selected filing profile name." Margin="0,4,0,10"/>'
          )
          Set-Content -Path $xamlPath -Value $xaml -Encoding UTF8

          $main = Get-Content $mainPath -Raw -Encoding UTF8
          $main = $main.Replace(
            '        CopyTextEnhancement.SelectedIndex = ScanTextEnhancement.SelectedIndex = 0;',
            '        CopyTextEnhancement.SelectedIndex = ScanTextEnhancement.SelectedIndex = 0;' + [Environment]::NewLine +
            '        CopyBlankModeCombo.ItemsSource = ScanBlankModeCombo.ItemsSource = new[] { "Conservative", "Normal", "Aggressive" };' + [Environment]::NewLine +
            '        ApplySavedImageSettings();'
          )

          $helperLines = @(
            '    private void ApplySavedImageSettings()',
            '    {',
            '        var settings = _settingsService.Settings;',
            '        CopyBrightness.Value = ScanBrightness.Value = Math.Clamp(settings.DefaultBrightness, -100, 100);',
            '        CopyContrast.Value = ScanContrast.Value = Math.Clamp(settings.DefaultContrast, -100, 100);',
            '        CopyGamma.Value = ScanGamma.Value = Math.Clamp(settings.DefaultGamma, 0.5, 2.0);',
            '        CopyTextEnhancement.SelectedItem = ScanTextEnhancement.SelectedItem = settings.DefaultTextEnhancement;',
            '        if (CopyTextEnhancement.SelectedItem is null)',
            '            CopyTextEnhancement.SelectedIndex = ScanTextEnhancement.SelectedIndex = 0;',
            '        CopySkipBlank.IsChecked = ScanSkipBlank.IsChecked = settings.DefaultSkipBlankPages;',
            '        CopyBlankModeCombo.SelectedItem = ScanBlankModeCombo.SelectedItem = settings.DefaultBlankDetection;',
            '        if (CopyBlankModeCombo.SelectedItem is null)',
            '            CopyBlankModeCombo.SelectedIndex = ScanBlankModeCombo.SelectedIndex = 0;',
            '    }',
            '',
            '    private void SaveImageSettings_Click(object sender, RoutedEventArgs e)',
            '    {',
            '        bool copy = sender is Button button && string.Equals(Convert.ToString(button.Tag), "Copy", StringComparison.OrdinalIgnoreCase);',
            '        var brightness = copy ? CopyBrightness : ScanBrightness;',
            '        var contrast = copy ? CopyContrast : ScanContrast;',
            '        var gamma = copy ? CopyGamma : ScanGamma;',
            '        var textEnhancement = copy ? CopyTextEnhancement : ScanTextEnhancement;',
            '        var skipBlank = copy ? CopySkipBlank : ScanSkipBlank;',
            '        var blankMode = copy ? CopyBlankModeCombo : ScanBlankModeCombo;',
            '',
            '        var settings = _settingsService.Settings;',
            '        settings.DefaultBrightness = (int)Math.Round(brightness.Value);',
            '        settings.DefaultContrast = (int)Math.Round(contrast.Value);',
            '        settings.DefaultGamma = gamma.Value;',
            '        settings.DefaultTextEnhancement = Convert.ToString(textEnhancement.SelectedItem) ?? "Off";',
            '        settings.DefaultSkipBlankPages = skipBlank.IsChecked == true;',
            '        settings.DefaultBlankDetection = Convert.ToString(blankMode.SelectedItem) ?? "Conservative";',
            '        _settingsService.Save();',
            '        ApplySavedImageSettings();',
            '        StatusText.Text = "Image enhancement settings saved as default";',
            '    }',
            ''
          ) -join [Environment]::NewLine
          $main = $main.Replace(
            '    private async Task RefreshDevicesAsync()',
            $helperLines + [Environment]::NewLine + '    private async Task RefreshDevicesAsync()'
          )

          $main = $main.Replace(
            '        var skipBlank = copy ? CopySkipBlank : ScanSkipBlank;',
            '        var skipBlank = copy ? CopySkipBlank : ScanSkipBlank;' + [Environment]::NewLine +
            '        var blankMode = copy ? CopyBlankModeCombo : ScanBlankModeCombo;'
          )
          $main = $main.Replace(
            '            BlankSensitivity = 0.995',
            '            BlankSensitivity = Convert.ToString(blankMode.SelectedItem) switch' + [Environment]::NewLine +
            '            {' + [Environment]::NewLine +
            '                "Aggressive" => 0.9975,' + [Environment]::NewLine +
            '                "Normal" => 0.9990,' + [Environment]::NewLine +
            '                _ => 0.9997' + [Environment]::NewLine +
            '            }'
          )

          $oldIncrement = @(
            '            if (profile.NamingMode == NamingMode.Incremental)',
            '            {',
            '                profile.NextNumber++;',
            '                _settingsService.Save();',
            '                ScanProfileCombo_SelectionChanged(null!, null!);',
            '            }'
          ) -join [Environment]::NewLine
          $newIncrement = @(
            '            bool usedManualOverride = !string.IsNullOrWhiteSpace(ScanOverrideNameText.Text);',
            '            if (profile.NamingMode == NamingMode.Incremental && !usedManualOverride)',
            '            {',
            '                profile.NextNumber++;',
            '                _settingsService.Save();',
            '                ScanProfileCombo_SelectionChanged(null!, null!);',
            '            }',
            '            if (usedManualOverride)',
            '            {',
            '                ScanOverrideNameText.Clear();',
            '                UpdateScanFilenamePreview();',
            '            }'
          ) -join [Environment]::NewLine
          $main = $main.Replace($oldIncrement, $newIncrement)

          $main = $main.Replace(
            '    private string BuildBaseName(FilingProfile profile)' + [Environment]::NewLine + '    {' + [Environment]::NewLine + '        return profile.NamingMode switch',
            '    private string BuildBaseName(FilingProfile profile)' + [Environment]::NewLine + '    {' + [Environment]::NewLine +
            '        string manualOverride = ScanOverrideNameText.Text.Trim();' + [Environment]::NewLine +
            '        if (!string.IsNullOrWhiteSpace(manualOverride)) return manualOverride;' + [Environment]::NewLine + [Environment]::NewLine +
            '        return profile.NamingMode switch'
          )

          $previewOld = '        ScanFilenamePreview.Text = $"Preview: {BuildBaseName(profile)}";' + [Environment]::NewLine + '    }' + [Environment]::NewLine + [Environment]::NewLine + '    private void BrowseScanFolder_Click'
          $previewNew = @(
            '        UpdateScanFilenamePreview();',
            '    }',
            '',
            '    private void UpdateScanFilenamePreview()',
            '    {',
            '        if (ScanProfileCombo.SelectedItem is FilingProfile profile)',
            '            ScanFilenamePreview.Text = $"Preview: {BuildBaseName(profile)}";',
            '    }',
            '',
            '    private void ScanOverrideNameText_TextChanged(object sender, TextChangedEventArgs e) => UpdateScanFilenamePreview();',
            '    private void ScanManualNameText_TextChanged(object sender, TextChangedEventArgs e) => UpdateScanFilenamePreview();',
            '    private void ScanNameOptionCombo_SelectionChanged(object sender, SelectionChangedEventArgs e) => UpdateScanFilenamePreview();',
            '',
            '    private void BrowseScanFolder_Click'
          ) -join [Environment]::NewLine
          $main = $main.Replace($previewOld, $previewNew)
          Set-Content -Path $mainPath -Value $main -Encoding UTF8

          [IO.File]::WriteAllBytes(
            "src\ScanPrintStudio\Helpers\ImageProcessing.cs",
            [Convert]::FromBase64String('')
          )
          $imageProcessingPath = "src\ScanPrintStudio\Helpers\ImageProcessing.cs"
          $imageProcessingText = Get-Content $imageProcessingPath -Raw -Encoding UTF8
          if ($imageProcessingText -notmatch "using System.IO;") {
            Set-Content -Path $imageProcessingPath -Value ("using System.IO;" + [Environment]::NewLine + $imageProcessingText) -Encoding UTF8
          }

          # Final source cleanup / validation for v1.0.7.
          $main = Get-Content $mainPath -Raw -Encoding UTF8
          $duplicateBlank = ('        var blankMode = copy ? CopyBlankModeCombo : ScanBlankModeCombo;' + [Environment]::NewLine) * 2
          $singleBlank = '        var blankMode = copy ? CopyBlankModeCombo : ScanBlankModeCombo;' + [Environment]::NewLine
          $main = $main.Replace($duplicateBlank, $singleBlank)

          if ($main -notmatch 'private void ScanOverrideNameText_TextChanged') {
            $eventHandlers = @(
              '    private void UpdateScanFilenamePreview()',
              '    {',
              '        if (ScanProfileCombo.SelectedItem is FilingProfile profile)',
              '            ScanFilenamePreview.Text = $"Preview: {BuildBaseName(profile)}";',
              '    }',
              '',
              '    private void ScanOverrideNameText_TextChanged(object sender, TextChangedEventArgs e) => UpdateScanFilenamePreview();',
              '    private void ScanManualNameText_TextChanged(object sender, TextChangedEventArgs e) => UpdateScanFilenamePreview();',
              '    private void ScanNameOptionCombo_SelectionChanged(object sender, SelectionChangedEventArgs e) => UpdateScanFilenamePreview();',
              ''
            ) -join [Environment]::NewLine
            $main = $main.Replace(
              '    private void BrowseScanFolder_Click(object sender, RoutedEventArgs e)',
              $eventHandlers + [Environment]::NewLine + '    private void BrowseScanFolder_Click(object sender, RoutedEventArgs e)'
            )
          }
          if ($main -notmatch 'private void ScanOverrideNameText_TextChanged') { throw "Manual filename event handlers were not generated." }
          Set-Content -Path $mainPath -Value $main -Encoding UTF8

          # v1.0.7: make the one-scan manual filename override authoritative for every profile type.
          $main = Get-Content $mainPath -Raw -Encoding UTF8

          $buildNamePattern = '(?s)    private string BuildBaseName\(FilingProfile profile\)\s*\{.*?\n    \}\s*\n\s*    private void ScanProfileCombo_SelectionChanged'
          $buildNameReplacement = @(
            '    private string BuildBaseName(FilingProfile profile)',
            '    {',
            '        string manualOverride = ScanOverrideNameText.Text.Trim();',
            '        if (!string.IsNullOrWhiteSpace(manualOverride))',
            '            return manualOverride;',
            '',
            '        return profile.NamingMode switch',
            '        {',
            '            NamingMode.Incremental => $"{profile.Prefix} {profile.NextNumber}".Trim(),',
            '            NamingMode.Selection => Convert.ToString(ScanNameOptionCombo.SelectedItem) ?? "",',
            '            _ => string.IsNullOrWhiteSpace(ScanManualNameText.Text) ? profile.Prefix : ScanManualNameText.Text.Trim()',
            '        };',
            '    }',
            '',
            '    private void ScanProfileCombo_SelectionChanged'
          ) -join [Environment]::NewLine
          if ($main -notmatch $buildNamePattern) { throw "Could not locate BuildBaseName for manual override patch." }
          $main = [regex]::Replace($main, $buildNamePattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $buildNameReplacement }, 1)

          $incrementPattern = '(?s)            if \(profile\.NamingMode == NamingMode\.Incremental\)\s*\{\s*profile\.NextNumber\+\+;\s*_settingsService\.Save\(\);\s*ScanProfileCombo_SelectionChanged\(null!, null!\);\s*\}'
          $incrementReplacement = @(
            '            bool usedManualOverride = !string.IsNullOrWhiteSpace(ScanOverrideNameText.Text);',
            '            if (profile.NamingMode == NamingMode.Incremental && !usedManualOverride)',
            '            {',
            '                profile.NextNumber++;',
            '                _settingsService.Save();',
            '                ScanProfileCombo_SelectionChanged(null!, null!);',
            '            }',
            '            if (usedManualOverride)',
            '            {',
            '                ScanOverrideNameText.Clear();',
            '                UpdateScanFilenamePreview();',
            '            }'
          ) -join [Environment]::NewLine
          if ($main -match $incrementPattern) {
            $main = [regex]::Replace($main, $incrementPattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $incrementReplacement }, 1)
          }
          elseif ($main -notmatch 'usedManualOverride') {
            throw "Could not locate incremental naming block for manual override counter protection."
          }

          if ($main -notmatch 'string manualOverride = ScanOverrideNameText\.Text\.Trim\(\);') { throw "Manual filename override was not wired into BuildBaseName." }
          Set-Content -Path $mainPath -Value $main -Encoding UTF8

          # Version corrected native build.
          $projectPath = "src\ScanPrintStudio\ScanPrintStudio.csproj"
          $project = Get-Content $projectPath -Raw -Encoding UTF8
          $project = $project.Replace("<Version>1.0.0</Version>", "<Version>1.0.7</Version>")
          $project = $project.Replace("<FileVersion>1.0.0.0</FileVersion>", "<FileVersion>1.0.7.0</FileVersion>")
          $project = $project.Replace("<AssemblyVersion>1.0.0.0</AssemblyVersion>", "<AssemblyVersion>1.0.7.0</AssemblyVersion>")
          Set-Content -Path $projectPath -Value $project -Encoding UTF8

          $xamlPath = "src\ScanPrintStudio\MainWindow.xaml"
          $xaml = Get-Content $xamlPath -Raw -Encoding UTF8
          $xaml = $xaml.Replace("v1.0.0 Native", "v1.0.7 Native")
          Set-Content -Path $xamlPath -Value $xaml -Encoding UTF8

          $issPath = "Installer\ScanPrintStudio.iss"
          $iss = Get-Content $issPath -Raw -Encoding UTF8
          $iss = $iss.Replace('#define MyAppVersion "1.0.0"', '#define MyAppVersion "1.0.7"')
          $iss = $iss.Replace("VersionInfoVersion=1.0.0.0", "VersionInfoVersion=1.0.7.0")
          Set-Content -Path $issPath -Value $iss -Encoding UTF8

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/ScanPrintStudio/ScanPrintStudio.csproj

      - name: Publish Windows application
        run: >
          dotnet publish src/ScanPrintStudio/ScanPrintStudio.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Add NAPS2 32-bit TWAIN worker
        shell: powershell
        run: |
          $worker = Get-ChildItem "$env:USERPROFILE\.nuget\packages\naps2.sdk.worker.win32" -Filter "NAPS2.Worker.exe" -Recurse -File |
            Sort-Object FullName |
            Select-Object -Last 1
          if (!$worker) { throw "NAPS2.Worker.exe was not found in the restored NAPS2.Sdk.Worker.Win32 package." }
          Copy-Item $worker.FullName "artifacts\publish\NAPS2.Worker.exe" -Force
          if (!(Test-Path "artifacts\publish\NAPS2.Worker.exe")) { throw "Failed to copy NAPS2.Worker.exe into publish output." }
          Get-Item "artifacts\publish\NAPS2.Worker.exe"
          Get-FileHash "artifacts\publish\NAPS2.Worker.exe" -Algorithm SHA256

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "Installer\ScanPrintStudio.iss"'

      - name: Verify outputs
        shell: powershell
        run: |
          if (!(Test-Path "artifacts\publish\ScanPrintStudio.exe")) { throw "Application executable missing." }
          if (!(Test-Path "artifacts\publish\NAPS2.Worker.exe")) { throw "NAPS2 32-bit TWAIN worker missing." }
          if (!(Test-Path "artifacts\installer\ScanPrintStudio-Setup-x64.exe")) { throw "Installer executable missing." }
          Get-Item artifacts\publish\ScanPrintStudio.exe
          Get-Item artifacts\publish\NAPS2.Worker.exe
          Get-Item artifacts\installer\ScanPrintStudio-Setup-x64.exe
          Get-FileHash artifacts\publish\ScanPrintStudio.exe -Algorithm SHA256
          Get-FileHash artifacts\publish\NAPS2.Worker.exe -Algorithm SHA256
